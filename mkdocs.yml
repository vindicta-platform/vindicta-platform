site_name: Vindicta Platform
site_description: Unified Gateway, UI, and Orchestration for the Vindicta Platform.
site_author: Vindicta Platform Contributors
site_url: https://vindicta-platform.github.io/docs

repo_name: vindicta-platform/vindicta-platform
repo_url: https://github.com/vindicta-platform/vindicta-platform

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Outfit
    code: JetBrains Mono

nav:
  - Home: index.md
  - Governance:
      - Constitution: constitution.md
  - Architecture:
      - C4 Model: architecture/c4-model.md
      - Decision Records:
          - Index: architecture/adr/index.md
          - "0000: Record architecture decisions": architecture/adr/0000-record-architecture-decisions.md
          - "0001: Use Markdown Architectural Decision Records": architecture/adr/0001-use-markdown-architectural-decision-records.md
  - Development:
      - Submodule Management: development/submodules.md
      - BDD Features: development/bdd-features.md
  - Subsystems:
    - Engine: https://vindicta-platform.github.io/vindicta-engine/
    - Foundation: https://vindicta-platform.github.io/vindicta-foundation/
    - Warscribe: https://vindicta-platform.github.io/warscribe-system/
    - Economy: https://vindicta-platform.github.io/vindicta-economy/
    - Oracle: https://vindicta-platform.github.io/vindicta-oracle/
    - Agents: https://vindicta-platform.github.io/vindicta-agents/
markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html

plugins:
  - search
