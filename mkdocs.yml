site_name: Vindicta Platform
site_description: Unified Gateway, UI, and Orchestration for the Vindicta Platform.
site_author: Vindicta Platform Contributors
site_url: https://vindicta-platform.github.io/vindicta-platform/

repo_name: vindicta-platform/vindicta-platform
repo_url: https://github.com/vindicta-platform/vindicta-platform

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: gold
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Outfit
    code: JetBrains Mono

nav:
  - Home: index.md
  - Foundation: '!include packages/vindicta-foundation/mkdocs.yml'
  - Agents: '!include packages/vindicta-agents/mkdocs.yml'

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html

plugins:
  - search
  - monorepo
