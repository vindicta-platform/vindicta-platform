name: Workflow Runtime Monitor

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  monitor:
    name: Analyze Workflow Run Times
    runs-on: ubuntu-latest
    steps:
      - name: Collect runtime stats
        uses: actions/github-script@v7
        with:
          script: |
            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: 'vindicta-platform', type: 'public'
            });

            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            let report = '## \u23f1\ufe0f Workflow Runtime Report\n\n';
            report += '| Repo | Workflow | Runs | Avg (min) | Max (min) | Status |\n';
            report += '|------|----------|:----:|:---------:|:---------:|:------:|\n';

            let slowWorkflows = 0;

            for (const repo of repos) {
              if (repo.archived) continue;
              try {
                const { data: workflows } = await github.rest.actions.listRepoWorkflows({
                  owner: 'vindicta-platform', repo: repo.name
                });

                for (const wf of workflows.workflows) {
                  try {
                    const { data: runs } = await github.rest.actions.listWorkflowRuns({
                      owner: 'vindicta-platform', repo: repo.name,
                      workflow_id: wf.id, per_page: 10,
                      created: `>=${since}`, status: 'completed'
                    });

                    if (runs.total_count === 0) continue;

                    const durations = runs.workflow_runs.map(r => {
                      const start = new Date(r.created_at);
                      const end = new Date(r.updated_at);
                      return (end - start) / 60000;
                    }).filter(d => d > 0);

                    if (durations.length === 0) continue;

                    const avg = (durations.reduce((a, b) => a + b, 0) / durations.length).toFixed(1);
                    const max = Math.max(...durations).toFixed(1);
                    const status = parseFloat(avg) > 10 ? '\ud83d\udd34 Slow' : parseFloat(avg) > 5 ? '\ud83d\udfe1 Moderate' : '\ud83d\udfe2 Fast';

                    if (parseFloat(avg) > 10) slowWorkflows++;

                    report += `| ${repo.name} | ${wf.name} | ${durations.length} | ${avg} | ${max} | ${status} |\n`;
                  } catch { continue; }
                }
              } catch { continue; }
            }

            report += `\n---\n`;
            if (slowWorkflows > 0) {
              report += `\u26a0\ufe0f **${slowWorkflows} workflow(s) averaging >10 minutes** \u2014 consider optimization.\n`;
            } else {
              report += `\u2705 All workflows within normal runtime bounds.\n`;
            }

            core.summary.addRaw(report);
            await core.summary.write();
