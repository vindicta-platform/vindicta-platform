name: Config Drift Detector

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: config-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  detect:
    name: Cross-Repo Config Comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive --depth 1 || true

      - name: Compare configs across packages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let report = '## \ud83d\udd0d Config Drift Report\n\n';
            const packagesDir = 'packages';
            if (!fs.existsSync(packagesDir)) {
              core.notice('No packages directory');
              return;
            }

            const packages = fs.readdirSync(packagesDir).filter(d =>
              fs.statSync(path.join(packagesDir, d)).isDirectory()
            );

            // Check for config files
            const configFiles = ['ruff.toml', '.ruff.toml', 'mypy.ini', '.mypy.ini', '.pre-commit-config.yaml'];
            const configMap = {};

            for (const cf of configFiles) {
              configMap[cf] = {};
              for (const pkg of packages) {
                const fp = path.join(packagesDir, pkg, cf);
                if (fs.existsSync(fp)) {
                  configMap[cf][pkg] = fs.readFileSync(fp, 'utf8').trim();
                }
              }
            }

            // Also check [tool.ruff] and [tool.mypy] in pyproject.toml
            const ruffSections = {};
            for (const pkg of packages) {
              const pp = path.join(packagesDir, pkg, 'pyproject.toml');
              if (!fs.existsSync(pp)) continue;
              const content = fs.readFileSync(pp, 'utf8');
              const ruffMatch = content.match(/\[tool\.ruff[\s\S]*?(?=\n\[|$)/m);
              if (ruffMatch) ruffSections[pkg] = ruffMatch[0].trim();
            }

            let driftCount = 0;
            report += '### Standalone Config Files\n\n';
            report += '| Config | Present In |\n|--------|-----------|\n';

            for (const [cf, pkgMap] of Object.entries(configMap)) {
              const presentIn = Object.keys(pkgMap);
              if (presentIn.length === 0) continue;
              report += `| \`${cf}\` | ${presentIn.join(', ')} |\n`;

              // Check for drift
              const values = Object.values(pkgMap);
              const unique = new Set(values);
              if (unique.size > 1) {
                driftCount++;
                report += `| \u26a0\ufe0f **DRIFT** | ${unique.size} different versions of \`${cf}\` |\n`;
              }
            }

            report += '\n### pyproject.toml [tool.ruff] Sections\n\n';
            const ruffValues = Object.values(ruffSections);
            const uniqueRuff = new Set(ruffValues);
            if (uniqueRuff.size > 1) {
              driftCount++;
              report += `\u26a0\ufe0f **DRIFT**: ${uniqueRuff.size} different ruff configs across ${Object.keys(ruffSections).length} packages\n`;
            } else if (ruffValues.length > 0) {
              report += `\u2705 All ${ruffValues.length} packages share the same ruff config\n`;
            }

            report += `\n---\n**Total drift instances:** ${driftCount}\n`;

            core.summary.addRaw(report);
            await core.summary.write();

            if (driftCount > 0) {
              core.warning(`${driftCount} config drift instance(s) detected`);
            }
