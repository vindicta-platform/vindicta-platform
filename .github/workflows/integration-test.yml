name: Integration Tests

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  integration:
    name: Cross-Package Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules (public HTTPS)
        run: |
          git submodule update --init --recursive --depth 1 || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5

      - name: Install all packages
        run: |
          uv sync --all-extras 2>/dev/null || uv sync 2>/dev/null || echo "::warning::uv sync failed"

      - name: Validate cross-package imports
        id: imports
        run: |
          echo "### 🔗 Cross-Package Import Validation" >> $GITHUB_STEP_SUMMARY
          FAILURES=0

          validate_import() {
            local label="$1"
            local import_cmd="$2"
            if uv run python -c "$import_cmd" 2>/dev/null; then
              echo "- ✅ $label" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $label — import failed" >> $GITHUB_STEP_SUMMARY
              FAILURES=$((FAILURES + 1))
            fi
          }

          validate_import "vindicta-foundation: VindictaModel" "from vindicta_foundation.models.base import VindictaModel"
          validate_import "vindicta-engine: dice module" "from vindicta_engine import dice"
          validate_import "vindicta-economy" "import vindicta_economy"
          validate_import "vindicta-oracle" "import vindicta_oracle"
          validate_import "warscribe-system" "import warscribe_system"

          echo "failures=${FAILURES}" >> $GITHUB_OUTPUT

      - name: Run BDD features (if available)
        id: bdd
        run: |
          if [ -d "features" ] && find features -name "*.feature" | head -1 | grep -q .; then
            echo "### 🧬 BDD Integration Results" >> $GITHUB_STEP_SUMMARY
            uv run behave features/ --format json -o integration_bdd_report.json --no-capture 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true
          else
            echo "::notice::No BDD features found for integration testing"
          fi
        continue-on-error: true

      - name: Upload integration report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: |
            integration_bdd_report.json
          retention-days: 14

      - name: Close stale integration issues on success
        if: steps.imports.outputs.failures == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'bug,integration', state: 'open'
            });
            for (const issue of issues) {
              if (issue.title.includes('Integration test failures')) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, state: 'closed',
                  state_reason: 'completed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '✅ All integration tests passing again. Auto-closing.'
                });
              }
            }

      - name: Create or update issue on failure
        if: steps.imports.outputs.failures != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const failures = '${{ steps.imports.outputs.failures }}';
            const title = `🚨 Integration test failures: ${failures} package(s) broken`;
            const body = `The nightly integration test detected ${failures} cross-package import failure(s).\n\nSee the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`;

            // Check for existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'bug,integration', state: 'open'
            });
            const existing = issues.find(i => i.title.includes('Integration test failures'));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `🔄 **Still failing** (${new Date().toISOString().slice(0, 10)}): ${failures} package(s) broken.\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
              core.notice(`Updated existing integration issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['bug', 'integration']
              });
            }
