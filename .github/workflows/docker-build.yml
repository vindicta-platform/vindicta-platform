name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.devcontainer/**'
      - 'packages/*/Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'Dockerfile'
      - '.devcontainer/**'
      - 'packages/*/Dockerfile'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Container Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            image: vindicta-platform
            dockerfile: Dockerfile
          - context: .
            image: vindicta-devcontainer
            dockerfile: .devcontainer/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::${{ matrix.dockerfile }} not found, skipping"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vindicta-platform/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        if: steps.check.outputs.exists == 'true'
        run: |
          echo '### 🐳 Docker Build' >> $GITHUB_STEP_SUMMARY
          echo '- **Image:** `ghcr.io/vindicta-platform/${{ matrix.image }}`' >> $GITHUB_STEP_SUMMARY
          echo '- **Dockerfile:** `${{ matrix.dockerfile }}`' >> $GITHUB_STEP_SUMMARY
          echo '- **Push:** ${{ github.event_name != 'pull_request' }}' >> $GITHUB_STEP_SUMMARY
