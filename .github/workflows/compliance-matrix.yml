name: Compliance Matrix

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  matrix:
    name: Generate Compliance Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Build cross-repo compliance report
        uses: actions/github-script@v7
        with:
          script: |
            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: 'vindicta-platform', type: 'public'
            });

            const now = new Date();
            let report = `# \ud83d\udccb Compliance Matrix \u2014 ${now.toISOString().slice(0, 10)}\n\n`;

            const checks = [
              { name: 'LICENSE', path: 'LICENSE' },
              { name: 'README', path: 'README.md' },
              { name: 'SECURITY', path: 'SECURITY.md' },
              { name: 'COC', path: 'CODE_OF_CONDUCT.md' },
              { name: 'CODEOWNERS', paths: ['CODEOWNERS', '.github/CODEOWNERS'] },
              { name: 'CI', path: '.github/workflows' },
              { name: 'Tests', paths: ['tests', 'test'] },
              { name: 'Docs', paths: ['docs', 'README.md'] },
              { name: 'Pre-commit', path: '.pre-commit-config.yaml' },
              { name: 'pyproject', path: 'pyproject.toml' }
            ];

            report += '| Repo |';
            checks.forEach(c => report += ` ${c.name} |`);
            report += ' Score |\n|------|';
            checks.forEach(() => report += ':---:|');
            report += ':----:|\n';

            let orgTotal = 0, orgMax = 0;

            for (const repo of repos) {
              if (repo.archived) continue;
              let score = 0;
              let row = `| [${repo.name}](${repo.html_url}) |`;

              for (const check of checks) {
                const pathsToCheck = check.paths || [check.path];
                let found = false;
                for (const p of pathsToCheck) {
                  try {
                    await github.rest.repos.getContent({
                      owner: 'vindicta-platform', repo: repo.name, path: p
                    });
                    found = true;
                    break;
                  } catch { continue; }
                }
                row += found ? ' \u2705 |' : ' \u274c |';
                if (found) score++;
              }

              const pct = Math.round((score / checks.length) * 100);
              const emoji = pct >= 90 ? '\ud83d\udfe2' : pct >= 70 ? '\ud83d\udfe1' : '\ud83d\udd34';
              row += ` ${emoji} ${pct}% |`;
              report += row + '\n';
              orgTotal += score;
              orgMax += checks.length;
            }

            const orgPct = orgMax > 0 ? Math.round((orgTotal / orgMax) * 100) : 0;
            report += `\n**Org Compliance:** ${orgPct}% (${orgTotal}/${orgMax})\n`;

            // Upsert issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'compliance,automated', state: 'open'
            });
            const existing = issues.find(i => i.title.includes('Compliance Matrix'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body: report,
                title: `\ud83d\udccb Compliance Matrix \u2014 ${now.toISOString().slice(0, 10)}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `\ud83d\udccb Compliance Matrix \u2014 ${now.toISOString().slice(0, 10)}`,
                body: report, labels: ['compliance', 'automated']
              });
            }

            core.summary.addRaw(report);
            await core.summary.write();
