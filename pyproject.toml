[project]
name = "vindicta-platform"
version = "0.1.0"
description = "Orchestrator: mono-entry point for the Vindicta Platform"
requires-python = ">=3.12"
dependencies = [
    "vindicta-foundation",
    "vindicta-engine",
    "warscribe-system",
]

[tool.uv.sources]
vindicta-foundation = { path = "vindicta-foundation", editable = true }
vindicta-engine = { path = "vindicta-engine", editable = true }
warscribe-system = { path = "warscribe-system", editable = true }
