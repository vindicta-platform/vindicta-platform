[project]
name = "vindicta-platform"
version = "0.1.0"
description = "Orchestrator: mono-entry point for the Vindicta Platform"
requires-python = ">=3.12"
dependencies = [
    "vindicta-foundation",
    "vindicta-engine",
    "warscribe-system",
]

[tool.uv.sources]
vindicta-foundation = { workspace = true }
vindicta-engine = { workspace = true }
warscribe-system = { workspace = true }

[tool.uv.workspace]
members = ["vindicta-foundation", "vindicta-engine", "warscribe-system"]
