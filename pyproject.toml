[project]
name = "vindicta-platform"
version = "0.1.0"
description = "Modular Monorepo: Unified entry point for the Vindicta Platform"
requires-python = ">=3.12"
dependencies = [
    "vindicta-foundation",
    "vindicta-engine",
    "vindicta-economy",
    "vindicta-oracle",
    "vindicta-agents",
    "warscribe-system",
]

[tool.uv.workspace]
members = ["packages/*", "features"]

[tool.uv.sources]
# Local workspace overrides
vindicta-foundation = { workspace = true }
vindicta-engine = { workspace = true }
vindicta-economy = { workspace = true }
vindicta-oracle = { workspace = true }
vindicta-agents = { workspace = true }
warscribe-system = { workspace = true }

[dependency-groups]
dev = [
    "mkdocs-monorepo-plugin>=1.1.2",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages", "features"]

[tool.ruff.lint]
ignore = ["D105"]

[tool.ruff.lint.extend-per-file-ignores]
"packages/vindicta-agents/tests/**/*.py" = ["D"]
"packages/vindicta-economy/tests/**/*.py" = ["D"]
"packages/vindicta-engine/tests/**/*.py" = ["D"]
"packages/vindicta-foundation/tests/**/*.py" = ["D"]
"packages/vindicta-oracle/tests/**/*.py" = ["D"]
"packages/warscribe-system/tests/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]
"features/**/*.py" = ["D", "E501", "F811"]
[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "packages"
exclude = [
    "^features/",
    "^packages/.*/features/",
    "^packages/.*/tests/",
    "^tests/"
]


[[tool.mypy.overrides]]
module = 'behave.*'
ignore_missing_imports = true
